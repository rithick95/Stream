name: cloud_stream
description: Stream cloud videos without downloading
publish_to: none
version: 0.1.0+1
environment:
  sdk: '>=3.3.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  media_kit: ^1.1.10
  media_kit_video: ^1.2.4
  media_kit_libs_video: ^1.0.4
  media_kit_libs_windows_video: ^1.0.9
  dio: ^5.4.0
  cached_network_image: ^3.3.1
  flutter_secure_storage: ^9.0.0
  flutter_web_auth_2: ^3.1.0
  shared_preferences: ^2.2.0
flutter:
  uses-material-design: true
