name: Build Android and Windows
on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: subosito/flutter-action@v2
        with: { channel: stable }
      - run: '[ -d android ] || flutter create . --platforms=android --org com.cloudstream'
      - run: flutter pub get
      - run: flutter build apk --release --dart-define=TMDB_KEY=${{ secrets.TMDB_KEY }}
      - uses: actions/upload-artifact@v4
        with: { name: android-apk, path: build/app/outputs/flutter-apk/app-release.apk }

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable }
      - run: flutter config --enable-windows-desktop
      - run: if (!(Test-Path windows)) { flutter create . --platforms=windows --org com.cloudstream }
      - run: flutter pub get
      - run: flutter build windows --release --dart-define=TMDB_KEY=${{ secrets.TMDB_KEY }}
      - uses: actions/upload-artifact@v4
        with: { name: windows-app, path: build/windows/x64/runner/Release }
